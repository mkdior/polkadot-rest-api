name: Audit approved upstream releases and publish binaries

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

# Deny by default. Only the final, trusted publication job can write releases.
permissions: {}

concurrency:
  group: approved-release-publisher
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: paritytech/polkadot-rest-api
  UPSTREAM_URL: https://github.com/paritytech/polkadot-rest-api.git

jobs:
  plan:
    name: Audit approvals and plan missing releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - name: Check out the trusted publisher branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Audit upstream and existing releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_COMMIT: ${{ github.sha }}
        run: bash .github/scripts/plan-releases.sh

  build:
    name: Build ${{ matrix.release.upstream_tag }} without write credentials
    needs: plan
    if: ${{ needs.plan.outputs.releases != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - name: Check out trusted build scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch the approved commit, build, and validate without execution
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_COMMIT: ${{ github.sha }}
          UPSTREAM_TAG: ${{ matrix.release.upstream_tag }}
          UPSTREAM_TAG_OBJECT: ${{ matrix.release.upstream_tag_object }}
          UPSTREAM_COMMIT: ${{ matrix.release.upstream_commit }}
          VERSION: ${{ matrix.release.version }}
          RELEASE_TAG: ${{ matrix.release.release_tag }}
          BUILDER_BASE: ${{ matrix.release.builder_base }}
          RUNTIME_BASE: ${{ matrix.release.runtime_base }}
          REVIEWED_AT: ${{ matrix.release.reviewed_at }}
          REVIEW_REFERENCE: ${{ matrix.release.review_reference }}
        run: bash .github/scripts/build-release.sh

      - name: Transfer the validated bundle to the publisher job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.release.release_tag }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Attest and publish ${{ matrix.release.upstream_tag }}
    needs:
      - plan
      - build
    if: ${{ needs.plan.outputs.releases != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - name: Check out trusted publisher scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download the build bundle on a fresh runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ matrix.release.release_tag }}
          path: dist

      - name: Revalidate the bundle before publication
        env:
          PUBLISHER_COMMIT: ${{ github.sha }}
          UPSTREAM_TAG: ${{ matrix.release.upstream_tag }}
          UPSTREAM_TAG_OBJECT: ${{ matrix.release.upstream_tag_object }}
          UPSTREAM_COMMIT: ${{ matrix.release.upstream_commit }}
          VERSION: ${{ matrix.release.version }}
          RELEASE_TAG: ${{ matrix.release.release_tag }}
          BUILDER_BASE: ${{ matrix.release.builder_base }}
          RUNTIME_BASE: ${{ matrix.release.runtime_base }}
          REVIEWED_AT: ${{ matrix.release.reviewed_at }}
          REVIEW_REFERENCE: ${{ matrix.release.review_reference }}
        run: bash .github/scripts/validate-bundle.sh dist

      - name: Generate GitHub artifact attestations
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/polkadot-rest-api-${{ matrix.release.upstream_tag }}-linux-x86_64
            dist/polkadot-rest-api-${{ matrix.release.upstream_tag }}-linux-x86_64.sha256
            dist/polkadot-rest-api-${{ matrix.release.upstream_tag }}-linux-x86_64.provenance.json

      - name: Create an immutable publisher-owned release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_COMMIT: ${{ github.sha }}
          UPSTREAM_TAG: ${{ matrix.release.upstream_tag }}
          UPSTREAM_TAG_OBJECT: ${{ matrix.release.upstream_tag_object }}
          UPSTREAM_COMMIT: ${{ matrix.release.upstream_commit }}
          VERSION: ${{ matrix.release.version }}
          RELEASE_TAG: ${{ matrix.release.release_tag }}
          BUILDER_BASE: ${{ matrix.release.builder_base }}
          RUNTIME_BASE: ${{ matrix.release.runtime_base }}
          REVIEWED_AT: ${{ matrix.release.reviewed_at }}
          REVIEW_REFERENCE: ${{ matrix.release.review_reference }}
        run: bash .github/scripts/publish-release.sh
